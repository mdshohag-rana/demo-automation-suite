# ================================================================================
name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

# REQUIRED FOR GITHUB PAGES
concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # =========================
      # CHECKOUT CODE
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # SETUP PYTHON
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # SETUP JAVA (ALLURE NEEDS THIS)
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # INSTALL DEPENDENCIES
      # =========================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      # =========================
      # RUN TESTS (DO NOT STOP PIPELINE)
      # =========================
      - name: Run tests
        run: |
          pytest -v --alluredir=allure-results || true

      # =========================
      # INSTALL ALLURE CLI
      # =========================
      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.29.0
          wget https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz
          tar -zxvf allure-${ALLURE_VERSION}.tgz
          sudo mv allure-${ALLURE_VERSION} /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      # =========================
      # GENERATE ALLURE REPORT
      # =========================
      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report

      # =========================
      # SEND HTML EMAIL (ONLY IF FAIL)
      # =========================
      - name: Send Beautiful HTML Email on Failure
        if: failure()
        run: |
          python <<EOF
          import smtplib
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText

          repo = "${{ github.repository }}"
          run_id = "${{ github.run_id }}"
          branch = "${{ github.ref_name }}"

          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          html = f"""
          <html>
          <head>
          <style>
              body {{
                  font-family: Arial;
                  background-color: #f4f6f9;
              }}
              .container {{
                  background: white;
                  padding: 20px;
                  border-radius: 10px;
                  width: 600px;
                  margin: auto;
                  box-shadow: 0px 0px 10px #ddd;
              }}
              .header {{
                  background: #e74c3c;
                  color: white;
                  padding: 10px;
                  text-align: center;
                  border-radius: 8px;
                  font-size: 18px;
              }}
              .box {{
                  background: #f8f9fa;
                  padding: 10px;
                  margin-top: 10px;
                  border-radius: 5px;
              }}
              .btn {{
                  display: inline-block;
                  margin-top: 15px;
                  padding: 10px 15px;
                  background: #3498db;
                  color: white;
                  text-decoration: none;
                  border-radius: 5px;
              }}
          </style>
          </head>

          <body>
              <div class="container">
                  <div class="header">
                      ❌ Playwright Test Failure Report
                  </div>

                  <div class="box"><b>Repository:</b> {repo}</div>
                  <div class="box"><b>Branch:</b> {branch}</div>
                  <div class="box"><b>Status:</b> FAILED ❌</div>

                  <a class="btn" href="{run_url}">
                      🔍 View GitHub Actions Run
                  </a>
              </div>
          </body>
          </html>
          """

          sender = "${{ secrets.EMAIL_USERNAME }}"
          password = "${{ secrets.EMAIL_PASSWORD }}"

          msg = MIMEMultipart("alternative")
          msg["Subject"] = "❌ Playwright Test Failure Report"
          msg["From"] = sender
          msg["To"] = sender

          msg.attach(MIMEText(html, "html"))

          server = smtplib.SMTP_SSL("smtp.gmail.com", 465)
          server.login(sender, password)
          server.sendmail(sender, sender, msg.as_string())
          server.quit()
          EOF

      # =========================
      # SETUP GITHUB PAGES
      # =========================
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # =========================
      # UPLOAD ALLURE REPORT
      # =========================
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report


  deploy-report:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
