name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

# REQUIRED FOR GITHUB PAGES
concurrency:
  group: "pages"
  cancel-in-progress: false


jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # =========================
      # CHECKOUT CODE
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # SETUP PYTHON
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =========================
      # SETUP JAVA (ALLURE NEEDS THIS)
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # =========================
      # INSTALL DEPENDENCIES
      # =========================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps
      
      # =========================
      # Create report directories
      # =========================
      - name: Create report directories
        run: |
          mkdir -p reports
          mkdir -p allure-results
          mkdir -p playwright-results

      # =========================
      # RUN TESTS (DO NOT STOP PIPELINE)
      # =========================
      - name: Run tests
        run: |
          pytest -v --alluredir=allure-results || true

      # =========================
      # INSTALL ALLURE CLI
      # =========================
      - name: Install Allure CLI
        run: |
          ALLURE_VERSION=2.29.0
          wget https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz
          tar -zxvf allure-${ALLURE_VERSION}.tgz
          sudo mv allure-${ALLURE_VERSION} /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure

      # =========================
      # GENERATE ALLURE REPORT
      # =========================
      - name: Generate Allure Report
        run: |
          allure generate allure-results --clean -o allure-report

     # =========================
      # SETUP GITHUB PAGES
      # =========================
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # =========================
      # UPLOAD ALLURE REPORT
      # =========================
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report


  deploy-report:
    needs: test
    runs-on: ubuntu-latest
    if: always()

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
