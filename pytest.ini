[pytest]
; === Discovery ===
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; === Playwright ===
addopts =
 --headless
 -s
 --slowmo=200
 --browser=chromium
 --screenshot=only-on-failure
 --video=retain-on-failure
 --tracing=retain-on-failure
 --output=test-results
 --html=test-results/report.html
 --alluredir=allure-results
 --junitxml=report.xml

; === Logging ===
log_cli = true
log_cli_level = INFO
; === Markers ===
markers =
 smoke: fast pre-deploy checks
 regression: full test
